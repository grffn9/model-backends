# One account per thing that pays for tokens; one backend per model reachable through it.
# ${VAR} reads the environment and ${VAR:-default} supplies a fallback.
#
# liveUsage reads an account's real usage from its provider:
#   copilot  AI credits used this month, with the Copilot CLI's GitHub sign-in
#   claude   percent of the 5-hour and weekly limits, with the account's Claude Code sign-in
#   codex    percent of the plan's windows and the credit balance, with the sign-in in CODEX_HOME
# limits are caps YOU choose, such as a monthly API budget, counted from calls made through the
# app. Never put a guess at a provider's limit here: an account with no real numbers shows none.
# price is USD per million tokens. Check it against the provider's pricing before relying on it.

accounts:
  copilot:
    label: GitHub Copilot
    kind: subscription
    liveUsage: { source: copilot }
  claude:
    label: Claude subscription
    kind: subscription
    liveUsage: { source: claude, configDir: "${CLAUDE_CONFIG_DIR_FOR_APP}" }
  codex:
    label: Codex
    kind: subscription
    liveUsage: { source: codex, configDir: "${CODEX_HOME}" }
  # Antigravity keeps a quota per model, so a limit pauses only the model that hit it.
  antigravity:
    label: Gemini (Antigravity)
    kind: subscription
    limitScope: model
  claude-api:
    label: Claude API
    kind: api
    limits:
      - { window: month, usd: 20 }
  gemini-api:
    label: Gemini API (free)
    kind: free
  deepseek-api:
    label: DeepSeek API
    kind: api

backends:
  - id: copilot-gpt-6-luna
    label: Copilot · GPT-6 Luna
    account: copilot
    adapter: copilot
    model: gpt-6-luna
    efforts: [low, medium, high, xhigh]
  - id: claude-opus-5-5
    label: Claude Code · Opus 5.5
    account: claude
    adapter: claude-cli
    model: claude-opus-5-5
    efforts: [low, medium, high, xhigh, max]
    env: { CLAUDE_CONFIG_DIR: "${CLAUDE_CONFIG_DIR_FOR_APP}" }
  - id: codex-gpt-6-luna
    label: Codex · GPT-6 Luna
    account: codex
    adapter: codex
    model: gpt-6-luna
    efforts: [low, medium, high, xhigh, max]
  - id: agy-gemini-3.8-flash
    label: Antigravity · Gemini 3.8 Flash
    account: antigravity
    adapter: agy
    model: "gemini-3.8-flash-{effort}"
    efforts: [low, medium, high]
  # Uses ANTHROPIC_API_KEY when set, otherwise your "ant auth login" sign-in.
  - id: claude-api-sonnet-5-5
    label: Claude API · Sonnet 5.5
    account: claude-api
    adapter: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
    model: claude-sonnet-5-5
    efforts: [low, medium, high, xhigh, max]
    price: { input: 2, output: 10 }
  - id: gemini-api-3.8-flash
    label: Gemini API · 3.8 Flash
    account: gemini-api
    adapter: gemini
    apiKeyEnv: GEMINI_API_KEY
    model: gemini-3.8-flash
    efforts: [low, medium, high]
  # Any OpenAI-compatible host works the same way: OpenRouter, Groq, xAI, Mistral and others.
  - id: deepseek-flash
    label: DeepSeek · V4.1 Flash
    account: deepseek-api
    adapter: openai
    baseUrl: https://api.deepseek.com
    apiKeyEnv: DEEPSEEK_API_KEY
    model: deepseek-flash
    efforts: [low, high, max]
    price: { input: 0.3, output: 1.2 }
